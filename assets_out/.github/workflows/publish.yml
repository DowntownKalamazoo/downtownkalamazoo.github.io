# Builds the website and publishes it to GitHub Pages.
# Runs whenever anything is committed to the main branch, once a day (so "coming up" lists and the
# holiday banner stay current), and on demand from the Actions tab ("Run workflow").
name: Build and publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # every day at 9:17 UTC (early morning in Kalamazoo)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the build needs
        run: pip install markdown pyyaml
      - name: Build the site
        env:
          TZ: America/Detroit
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
