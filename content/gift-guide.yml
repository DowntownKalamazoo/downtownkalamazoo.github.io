# Holiday Gift Guide (downtownkalamazoo.us/holidays/gifts.html)
#
# Every gift on the page comes from this file. Each business is one block, with its gifts listed under it.
# The business's name, address, link and Downtown Dollars badge come from the business directory, so you
# never type them here. Businesses with at least one gift get an "In the Gift Guide" tag in the directory.
#
# business:   the business's directory id, the end of its directory link
#             (directory.html#b-rustica is "rustica"). Use "downtown" for Downtown Kalamazoo itself.
#             For a business that isn't in the directory yet, use name: instead (and add it to the
#             directory when you can, so its gifts link to a listing).
# gifts:      one entry per gift, each starting with "- name:"
#
# For each gift:
#   name:              what the gift is, as it should appear on the tag
#   kind:              unwrap, experience, eat-drink or gift-card
#   for:               who it suits, in square brackets. Any of:
#                      foodie, maker, kid, kalamazoo-lover, self-care, adventurer, coffee-tea, arts-fan,
#                      someone-special, host, pet, has-everything
#   description:       one or two sentences (about 200 characters at most)
#   price:             optional, in quotes, like "$24" or "$5, $10 or $20". The lowest amount decides the
#                      budget filter. Leave it "" until you know it.
#   image:             optional photo, uploaded to files/gifts, like files/gifts/cherris-truffles.jpg
#                      Any size is fine. The site resizes it.
#   image_alt:         required with a photo. A sentence describing it for people who can't see it.
#   photo_focus:       optional: top or bottom, if the photo's crop cuts off the product (center is normal)
#   wrap_label:        one or two words shown on the gift wrap when there's no photo, like Truffles.
#                      If it's blank, the tag uses the gift's name.
#   link:              optional. Where the "From" line goes instead of the directory listing,
#                      like dollars.html or a full https:// address.
#   only_in_kalamazoo: yes     adds the "Only in Kalamazoo" tag
#   gives_back: yes            adds the "Gives back" tag
#   stocking_stuffer: yes      includes it when someone chooses Stocking stuffers
#   age_21: yes                adds a 21+ tag and hides it when someone chooses "Hide 21+ gifts"
#   draft: true                hides the gift (sold out, or not ready). Remove the line to show it again.
#
# Anything still in [square brackets] keeps a gift off the page until it's replaced, and the Actions
# tab lists it in yellow. So does a gift with no description.
#
# If a line has a colon followed by a space, or starts with a quote mark, put the whole value in double
# quotes, like the descriptions below that have colons in them.

