# Quick changes to the business directory, on top of the main spreadsheet (imported into directory.json).
# The spreadsheet is the main record. Use this file for small fixes between spreadsheet updates.
#
# hide:            ids to keep off the site, with the reason
# update:          change details for a business already in the directory, by its id
#                  (the id is the end of its link, for example directory.html#b-rustica is "rustica")
#                  fields: name, desc, website, phone, address, hours, cat, dd (Downtown Dollars), sd (Social District)
#                  hours: one line per group of days, for example
#                    hours:
#                      - Mon–Fri 10am–6pm
#                      - Sat 10am–5pm
#                      - Sun closed
#                  cat: move a business to another type (shop, dine, arts, services, stay, orgs)
# social_district: extra ids to tag as Social District
# aliases:         other names a business goes by, by its id, for example
#                    aliases:
#                      sit-and-stay-winery: [Sit & Stay Winery & Brewery]
#                  An event whose where: line starts with the business's name or one of these links to its listing
#                  on its own, and the event form suggests them. Capitals, "The", punctuation and & vs. and don't matter.
# add:             businesses that aren't in the spreadsheet yet (name, cat, address, phone, website, desc, hours,
#                  social_district: true, downtown_dollars: true). cat is shop, dine, arts, services, stay, offices or orgs.
#
# Social District tags checked Nov 3, 2026, against the State (MLCC) Social District permit list (updated
# Oct 29, 2026) and the City's downtown Social District map (April 2026). Only businesses on both are tagged.
# To take the tag off a business, add sd: false under its id in update:.
#
# November 2026 update: offices and professional firms were taken off the site (listed under hide:), and
# hours, phone numbers and website links were added from each business's own website, checked Oct 30-31, 2026.

