# Downtown Ambassadors page (ambassadors.html)
#
# Three parts live here: hours and contact, the team, and the monthly reports.
# The spaces at the start of each line matter. Copy an existing entry and keep its spacing.

# ---------------------------------------------------------------- Hours, phone and header photo
# phone:      the ambassadors' service line, shown at the top of the page with a call button
# hours:      one line per group of days. Change the times here and the page updates.
# team_photo: the group photo at the top of the page. Use a wide JPG under 500 KB in files/ambassadors/.
# team_photo_alt: one sentence describing the photo for people who can't see it.

phone: 269-568-5402
hours:
  - days: Sunday – Tuesday
    time: 8 a.m. – 6:30 p.m.
  - days: Wednesday – Saturday
    time: 8 a.m. – 10:30 p.m.
team_photo: files/ambassadors/ambassadors-team.jpg
team_photo_alt: Six Downtown Ambassadors in green Downtown Kalamazoo shirts and caps stand arms crossed in a painted blue alley, between two branded cleaning carts.

# ---------------------------------------------------------------- Meet the Ambassadors
# One entry per ambassador, in the order they should appear.
#   name:      as they'd like it shown (first name only is fine)
#   role:      shown under their name (optional), e.g. Operations Manager. Leave blank for ambassadors.
#   since:     the year they joined (optional)
#   note:      a short line about them (optional), e.g. "Ask about the best tacos downtown."
#   photo:     upload a photo to files/ambassadors/ and put its path here, e.g. files/ambassadors/skylar.jpg
#              Use a JPG, cropped taller than wide (about 4:5), under 500 KB.
#              Leave blank to show a brand-pattern card with their initials until the photo is ready.
#   photo_alt: one sentence describing the photo, e.g. "Skylar smiling on the Kalamazoo Mall in the blue Downtown Ambassador jacket."
# To take someone off the page, delete their entry.

team:
  - name: Skylar
    since: 2021
    note: Here since the program started, and a familiar face all over downtown.
    photo: files/ambassadors/skylar.jpg
    photo_alt: Skylar smiles while pushing a Keeping Downtown Kalamazoo Clean cart down a painted blue alley.

  - name: Marquis
    photo: files/ambassadors/marquis.jpg
    photo_alt: Marquis grins, leaning his arms on his Keeping Downtown Kalamazoo Clean cart.

  - name: Zach
    photo: files/ambassadors/zach.jpg
    photo_alt: Zach stands behind his cleaning cart in a painted blue alley lined with café tables.

  - name: Baily
    photo: files/ambassadors/baily.jpg
    photo_alt: Baily, in a long-sleeved green Downtown Kalamazoo shirt, pushes a cleaning cart under strings of lights.

  - name: Summer
    photo: files/ambassadors/summer.jpg
    photo_alt: Summer, in sunglasses and a Downtown Kalamazoo cap, smiles behind her cleaning cart.

  - name: Adam
    role: Operations Manager
    photo: files/ambassadors/adam.jpg
    photo_alt: Adam smiles from the driver's seat of the brightly wrapped Downtown Kalamazoo truck.

  - name: Leandra
    photo:
    photo_alt:

  - name: Kevin
    photo:
    photo_alt:

# ---------------------------------------------------------------- Monthly reports
# Newest first. Each month:
#   1. Upload the PDF to files/ambassadors/ named ambassador-report-YYYY-MM.pdf
#   2. Copy the top entry, paste it above it, and change month, file and highlights.
#   3. Copy the numbers from the report's "Stats By Zone" page (the Total column).
# The page adds up the numbers for the year on its own.
# If there's no PDF for a month, leave file blank. Its numbers still count.

reports:
  - month: 2026-07
    file: files/ambassadors/ambassador-report-2026-07.pdf
    highlights:
      - Helped a property owner clean up a hard-to-reach spot, working with the Public Safety Community Service Team and the City’s Community Planning & Economic Development department.
      - Removed 31 pieces of graffiti and hand bills. A friendly reminder to event promoters that posting hand bills isn’t the way to get the word out.
