  holiday: A quieter weekday holiday outing
  before_you_go: Book classes and appointments ahead. Prices vary.

- slug: lights-and-trolley
  title: A holiday lights and trolley evening
  summary: Ride the free trolley, warm up, and end with a photo under the lights.
  best_for: Families, couples and visitors
  time: 2 to 4 hours
  budget: "$"
  who: [families, couples, visitors]
  days: [thu, fri, sat, sun]
  when: Thursday to Sunday, Nov. 27 to Dec. 24, and Dec. 31
  events: [tree-lighting, december-to-remember, new-years-fest]
  steps:
    - Check the Holly Jolly Trolley schedule and stops before you plan your route.
    - Start at City Hall on South Street and ride to stops that may include Santa's Workshop on the Kalamazoo Mall and Bates Alley.
    - Get a warm drink at a nearby café, or have dinner at a downtown restaurant.
    - Finish with a holiday photo on the Kalamazoo Mall.
