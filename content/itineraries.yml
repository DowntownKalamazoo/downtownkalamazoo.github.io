# Plan your day: the holiday itineraries (downtownkalamazoo.us/holidays/plan.html)
#
# Each plan below becomes its own page, like holidays/plan/family-afternoon.html, and shows up in the
# Plan your day filters. Copy a whole plan (from "- slug:" down to the next one) to add a new one.
#
# slug:          the page address. Lowercase words with dashes. Don't change it once a plan is live.
# title:         the plan's name
# summary:       one sentence for the plan's card and the top of its page
# best_for:      who it suits, in plain words
# time:          about how long it takes
# budget:        per person, in quotes: "Free", "$" (under $25), "$$" ($25 to $60) or "$$$" (over $60)
# who:           the "Who's coming?" filters it appears under. Any of:
#                families, couples, friends, adults, teens, solo, visitors, pets
# days:          the days it works, as mon tue wed thu fri sat sun, or "all"
# when:          one line about the best days or dates
# events:        holiday events it pairs with (the end of the event's page address, like tree-lighting).
#                The plan is listed under "Make a day of it" on those event pages.
# gifts:         optional. Adds a gift guide link: all, art-lover, foodie, kids, host, stocking or experiences
# steps:         the stops, in order. Business names that match the directory link to their listing
#                automatically, and so do holiday event names, Santa's Workshop and the Holly Jolly Trolley.
#                To link other words, write [the words](gifts.html) with a page on this site.
# holiday:       the holiday tie-in, one line
# before_you_go: one line on what to check first
# draft: true    hides a plan while you work on it
#
# If a line has a # or a colon followed by a space in it, put the whole line in double quotes,
# like the two steps below that end with #SomethingNewKalamazoo.
#
# The slug build-your-own is taken by the build-your-own itinerary page.
#
# Santa's Workshop and Holly Jolly Trolley hours, used by the "When are you going?" box on each plan.
# Each line is days: hours. Dates are written as YYYY-MM-DD.
santa:
  name: Santa's Workshop
  where: City Centre, second floor, 125 S. Kalamazoo Mall
  opens: 2026-11-28
  closes: 2026-12-24
  hours:
    thu: 5 to 8 p.m.
    fri: 5 to 8 p.m.
    sat: Noon to 6 p.m.
    sun: Noon to 4 p.m.
  special:
    2026-11-28: Noon to 6 p.m. (opening day)
    2026-12-21: 5 to 8 p.m.
    2026-12-22: 5 to 8 p.m.
    2026-12-23: 5 to 8 p.m.
    2026-12-24: Noon to 4 p.m.
trolley:
  name: Holly Jolly Trolley
  where: Leaves from City Hall, 241 W. South St.
  opens: 2026-11-27
  closes: 2026-12-24
  hours:
    thu: 5 to 9 p.m.
    fri: 5 to 9 p.m.
    sat: Noon to 7 p.m.
    sun: Noon to 4 p.m.
  special:
    2026-12-21: 5 to 9 p.m.
    2026-12-22: 5 to 9 p.m.
    2026-12-23: 5 to 9 p.m.
    2026-12-24: Noon to 4 p.m.
    2026-12-31: 6 to 11 p.m.

# Parking and getting here. Prints at the bottom of every plan and every build-your-own itinerary.
# Each line under items is one bullet. Keep them short. Put a line in double quotes if it has a colon in it.
parking:
  title: Parking and getting here
  items:
    - "Ramps: the first 90 minutes are free in the Epic Center and Kalamazoo Mall parking ramps."
    - "Street parking: $2 an hour in the core of downtown and $1.50 an hour on surrounding streets. Meters are enforced starting at 10 a.m."
    - Pay at a kiosk with coins or a card, or with the ParkMobile app.
    - The free Holly Jolly Trolley leaves City Hall, 241 W. South St., Thursday to Sunday through Dec. 24, and on Dec. 31.
  more: "Maps and updates at parkkalamazoo.org. Ramp questions: Park Kalamazoo, (269) 342-6383."

plans:
- slug: family-afternoon
  title: A family holiday afternoon
  summary: Santa, a downtown photo hunt and a warm treat, paced for little legs.
  best_for: Families with young kids
  time: About 4 hours
  budget: "Free"
  who: [families]
  days: [thu, fri, sat, sun]
  when: Thursday to Sunday while Santa's Workshop is open, from Nov. 28
  events: [small-business-saturday, gingerbread-wonderland]
  gifts: kids
  steps:
    - Start at Santa's Workshop in City Centre (125 S. Kalamazoo Mall, second floor) for a visit with Santa, a letter to Santa, or a craft.
    - Pick up a holiday photo scavenger hunt card at the workshop and look for the signature holiday items around downtown.
    - "Take family photos at a downtown selfie station and share them with #SomethingNewKalamazoo."
    - Warm up with a treat from Sarkozy Bakery or Cherri's Chocol'art.
  holiday: Santa's Workshop, the holiday photo scavenger hunt and selfie stations
  before_you_go: Check Santa's Workshop hours for the day you're going.

- slug: friday-night
  title: A Friday night downtown
  summary: Dinner, a show and a nightcap, all a few blocks apart.
  best_for: Couples and friends
  time: About 5 hours
  budget: "$$$"
  who: [couples, friends, adults]
  days: [fri]
  when: Friday evenings. Art Hop is Nov. 6 and Dec. 4.
  events: [first-friday-nov, first-friday-dec]
  steps:
    - Start with dinner at 600 Kitchen and Bar, Principle Food & Drink, or Rustica.
    - Catch a performance at the Kalamazoo State Theatre, Civic Theatre, or Farmers Alley Theatre. Check current listings.
    - Finish with drinks at Bell's Eccentric Café or The Kalamazoo Stillhouse.
  holiday: First Friday & Art Hop, or another Friday in the season
  before_you_go: Confirm showtimes, make dinner reservations, and check event hours.

- slug: shop-small
  title: Shop small and dine local
  summary: A full day of locally owned shops, with lunch and dinner in between.
  best_for: Gift shoppers
  time: Most of a day
  budget: "$$"
  who: [friends, solo, adults, families]
  days: all
  when: Any day. Best on Small Business Saturday, Nov. 28.
  events: [small-business-saturday, moonlight-madness]
  gifts: all
  steps:
    - Browse gifts at Kalamazoo Candle Company, Kalamazoo Dry Goods, LUXE Gift Shop & Boutique, Stewart & Company, and K'zoo in the Mitten.
    - Find something playful at Rocket Fizz, Uncle Buddy's Toy Stash, Pop City Popcorn, or Kalamazoo Antique Mall.
    - Pause for lunch at City Centre Market and Deli, Caffe Casa, or Water Street Coffee Joint.
    - End with dinner at Bimbo's Pizza, Maru Sushi & Grill, or Toba Sushi and Ramen.
  holiday: Shop Small Saturday, Nov. 28
  before_you_go: Check each shop's hours, especially on Sundays.

- slug: arts-evening
  title: An arts and culture evening
  summary: Galleries, a maker studio and a curtain call on a First Friday.
  best_for: Art and theater lovers
  time: About 5 hours
  budget: "$$"
  who: [couples, friends, adults, solo]
  days: [fri]
  when: First Fridays, Nov. 6 and Dec. 4
  events: [first-friday-nov, first-friday-dec, new-years-fest]
  gifts: art-lover
  steps:
    - Visit First Friday & Art Hop galleries and creative spaces.
    - Explore art and maker experiences at Glass Art Kalamazoo, Combat Ready Art, or Kalamazoo Book Arts Center.
    - See a performance at Farmers Alley Theatre, Civic Theatre, or Crawlspace Comedy Theatre.
    - Finish with a late bite or drink at Old Dog Tavern or Shakespeare's Pub.
  holiday: First Friday & Art Hop, Nov. 6 and Dec. 4
  before_you_go: Check which venues are on this month's Art Hop list, and get show tickets ahead.

- slug: under-50
  title: Holiday experiences under $50
  summary: Photo stops, holiday windows and a shared treat, with money left over.
  best_for: Anyone on a budget
  time: Half a day
  budget: "Free"
  who: [families, couples, friends, solo, visitors]
  days: all
  when: Any day. Add Santa's Workshop Thursday to Sunday.
  events: [tree-lighting, december-to-remember, holiday-parade]
  gifts: stocking
  steps:
    - Make a free holiday photo stop at a selfie station, or take part in the photo scavenger hunt.
    - Browse holiday windows and small shops such as K'zoo in the Mitten, Rocket Fizz, and Kalamazoo Dry Goods.
    - Share a coffee or bakery treat at Factory Coffee Shop, Caffe Casa, or Sarkozy Bakery.
    - Look for free holiday programming or public art before heading home.
  holiday: Santa's Workshop, the holiday photo scavenger hunt and selfie stations
  before_you_go: The $50 is a guide, not a promise. Prices and event details vary.

- slug: last-minute
  title: A last-minute downtown outing
  summary: Two easy hours for a gift, a quick meal and a look at the lights.
  best_for: Last-minute planners
  time: About 2 hours
  budget: "$"
  who: [solo, friends, couples, adults]
  days: all
  when: Any day, right up to Christmas Eve
  events: [small-business-saturday]
  gifts: stocking
  steps:
    - Choose one easy stop. Rocket Fizz for a fun browse, Kalamazoo Candle Company for a gift, or Cherri's Chocol'art for a sweet treat.
    - Grab a quick meal at Benny DiCarta's, Coney Island Hot Dogs, or City Centre Market and Deli.
    - Take a short walk along the Kalamazoo Mall to enjoy the decorations and snap a photo.
  holiday: Holiday shopping. Downtown Dollars arrive by email, so they work as a gift even on Christmas Eve.
  before_you_go: Check business hours before heading out.

- slug: sparkle-date
  title: A holiday date with a little sparkle
  summary: Jewelry browsing, a nice dinner and a stroll under the lights.
  best_for: Couples
  time: 3 to 4 hours
  budget: "$$$"
  who: [couples]
  days: all
  when: Any evening. The trolley runs Thursday to Sunday.
  gifts: all
  steps:
    - Browse jewelry at Nord Jewelers or Morrison Jewelers, and gifts at The Aroma Labs.
    - Enjoy dinner at ROCA, Comensoli's, or 600 Kitchen and Bar.
    - Take an evening stroll along the Kalamazoo Mall to see the decorations, and see if the Holly Jolly Trolley is running.
  holiday: Holly Jolly Trolley, Nov. 27 to Dec. 24 and Dec. 31
  before_you_go: Book dinner ahead and check shop hours.

- slug: coffee-and-browsing
