    - Pick up a sweet treat at Sarkozy Bakery or Cherri's Chocol'art.
    - Take a few holiday photos along the Kalamazoo Mall.
  holiday: First Friday & Art Hop, or a visit to the holiday selfie stations
  before_you_go: Check shop hours.

- slug: kids-craft-day
  title: A kids' holiday craft day
  summary: Crafts and a letter to Santa at his workshop, then a bakery snack.
  best_for: Families with school-age kids
  time: 2 to 4 hours
  budget: "Free"
  who: [families]
  days: [thu, fri, sat, sun]
  when: Thursday to Sunday. Ornament making Sat., Dec. 12. Holiday cards Sat., Dec. 19.
  events: [small-business-saturday]
  steps:
    - Visit Santa's Workshop during its open hours.
    - Choose a craft, or plan around ornament making on Saturday, Dec. 12, or holiday cards on Saturday, Dec. 19.
    - Write a letter to Santa. Letters with a return address you can read get a reply through Dec. 15.
    - Take a photo at a selfie station and enjoy a snack from Sarkozy Bakery.
  holiday: Santa's Workshop. Ornament making Dec. 12 and holiday cards Dec. 19.
  before_you_go: Check Santa's hours and the themed activity dates.

- slug: pet-friendly
  title: A pet-friendly holiday outing
  summary: Pets with Santa, a pet shop stop and a coffee for you.
  best_for: Pet owners
  time: 2 to 3 hours
  budget: "$"
  who: [pets, families]
