  best_for: Friends and competitive shoppers
  time: 3 to 5 hours
  budget: "$$"
  who: [friends, families]
  days: [sat]
  when: Small Business Saturday, Nov. 28
  events: [small-business-saturday]
  gifts: stocking
  steps:
    - Make a gift list and visit at least four locally owned shops, such as Kalamazoo Candle Company, LUXE Gift Shop & Boutique, Rocket Fizz, and Stewart & Company.
    - Find one gift under $15 and one gift for someone who's hard to shop for.
    - Stop for lunch at City Centre Market and Deli or Caffe Casa.
    - Look for the Downtown Dollars giveaway and the holiday shopping bag.
  holiday: Shop Small Saturday, Nov. 28
  before_you_go: Check giveaway rules and which businesses are taking part. Bags are available while supplies last.

